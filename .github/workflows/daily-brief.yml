name: Daily Global Tech Brief

on:
  schedule:
    # 北京时间每天 07:23 触发（避开 07:30 整点/半点排队高峰，UTC 23:23）
    - cron: '23 23 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: '手动覆盖回溯小时数（留空则按周一72h/平日24h自动计算）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Fetch candidates (0 token)
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
        run: python scripts/fetch_news.py

      - name: Step 2 - Verify & Generate HTML / WeChat Text (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python scripts/generate_brief.py

      - name: Step 3 - Commit & Publish to GitHub Pages (/docs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update global tech brief $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Step 4 - Send WeChat Text & URL to Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python scripts/send_email.py
