name: Daily Global Tech Brief

on:
  schedule:
    # 仅北京时间周一至周五发送（对应 UTC 周日至周四 0-4；周六周日不发，周一自动汇总72小时）：
    # 三重保险防 GitHub 漏单与高峰延迟（内置“当日已成功则自动跳过”防重发逻辑）：
    # 1. 北京时间周一至周五 06:53（UTC 周日至周四 22:53，主触发，避开 UTC 00:00 全球最堵时段）
    - cron: '53 22 * * 0-4'
    # 2. 北京时间周一至周五 07:23（UTC 周日至周四 23:23，第一重兜底）
    - cron: '23 23 * * 0-4'
    # 3. 北京时间周一至周五 07:53（UTC 周日至周四 23:53，第二重兜底）
    - cron: '53 23 * * 0-4'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: '手动覆盖回溯小时数（留空则按周一72h/平日24h自动计算）'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-global-tech-brief
  cancel-in-progress: false

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check if already succeeded today (Beijing time)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          event_name = os.environ.get("EVENT_NAME", "")
          out_path = os.environ["GITHUB_OUTPUT"]

          if event_name != "schedule":
              with open(out_path, "a") as f:
                  f.write("should_run=true\n")
              print("Manual trigger: always run.")
              raise SystemExit(0)

          bj_tz = timezone(timedelta(hours=8))
          today_bj = datetime.now(bj_tz).strftime("%Y-%m-%d")
          repo = os.environ["REPO"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/daily-brief.yml/runs?per_page=15"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              runs = json.loads(resp.read().decode("utf-8")).get("workflow_runs", [])

          already_done = False
          for r in runs:
              if r.get("conclusion") == "success":
                  dt_utc = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                  if dt_utc.astimezone(bj_tz).strftime("%Y-%m-%d") == today_bj:
                      already_done = True
                      print(f"Already succeeded today ({today_bj}): run #{r.get('run_number')}")
                      break

          with open(out_path, "a") as f:
              f.write(f"should_run={'false' if already_done else 'true'}\n")
          EOF

      - name: Checkout repository
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Fetch candidates (0 token)
        if: steps.guard.outputs.should_run == 'true'
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
        run: python scripts/fetch_news.py

      - name: Step 2 - Verify & Generate HTML / WeChat Text (Gemini API)
        if: steps.guard.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python scripts/generate_brief.py

      - name: Step 3 - Commit & Publish to GitHub Pages (/docs)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update global tech brief $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Step 4 - Send WeChat Text & URL to Gmail
        if: steps.guard.outputs.should_run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python scripts/send_email.py
